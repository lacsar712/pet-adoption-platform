# docker-compose.ci.yml
# --------------------------------------------------------------------------
# CI overlay. Applied ON TOP of docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml <cmd>
#
# What this overlay changes vs. the base (local one-shot demo) file:
#   - ports are parameterized via PET_*_PUBLISH_PORT env vars
#   - db host port is NOT published (avoids host port contention in CI)
#   - frontend build arg VITE_API_URL is wired from PET_VITE_API_URL
#   - healthchecks are delegated to the externalized .ci/scripts probes,
#     mounted read-only into the containers (no inline curl in YAML)
#
# NOTE on backend unit tests: they run OUTSIDE compose via jest +
# mongodb-memory-server (see .ci/test.yml). The real `db` service below is
# only for demo / integration validation, never a precondition for unit tests.
# --------------------------------------------------------------------------
services:
  db:
    # Do not publish Mongo to the host in CI to avoid port 5731 contention.
    ports: !reset []
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    environment:
      PORT: 8731
      NODE_ENV: production
    ports:
      - "${PET_API_PUBLISH_PORT:-8731}:8731"
    volumes:
      # externalized healthcheck probe (read-only)
      - ./.ci/scripts/backend-healthcheck.sh:/opt/healthcheck.sh:ro
    healthcheck:
      test: ["CMD", "sh", "/opt/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${PET_VITE_API_URL:-/api}"
    ports:
      - "${PET_WEB_PUBLISH_PORT:-3731}:80"
    volumes:
      - ./.ci/scripts/frontend-healthcheck.sh:/opt/healthcheck.sh:ro
    healthcheck:
      # probe port 80 inside the container network
      test: ["CMD", "sh", "-c", "HC_PORT=80 sh /opt/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
