services:
  db:
    image: docker.m.daocloud.io/library/mongo:7
    container_name: pet-adoption-db
    restart: unless-stopped
    ports:
      - "5731:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: pet-adoption-backend
    restart: unless-stopped
    environment:
      PORT: 8731
      MONGODB_URI: mongodb://db:27017/pet_adoption
      JWT_SECRET: pet-adoption-docker-secret
      SEED_DEMO: "true"
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    ports:
      - "8731:8731"
    volumes:
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: pet-adoption-frontend
    restart: unless-stopped
    ports:
      - "3731:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:
  upload_data:

networks:
  app-network:
    driver: bridge
